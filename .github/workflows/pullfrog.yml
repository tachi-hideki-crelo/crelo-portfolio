# Reviewed PR-only runtime. See docs/PULLFROG.md before changing the pin or permissions.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Pullfrog PR review dispatch JSON
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    # Never run the credential-bearing integration from a fork or a PR head.
    if: ${{ github.repository == 'tachi-hideki-crelo/crelo-portfolio' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pullfrog-review-${{ github.repository }}-${{ fromJSON(inputs.prompt).event.issue_number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Job-scoped runner proof for the existing Pullfrog/ChatGPT connection.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate review dispatch
        run: node scripts/validate-pullfrog-dispatch.mjs
        env:
          PULLFROG_DISPATCH: ${{ inputs.prompt }}
      - name: Run agent
        uses: tachi-hideki-crelo/pullfrog-security@5fd66c952a0c1abd5ce9fb8afec3d93c04bbc2c7
        with:
          push: disabled
          shell: restricted
          model: openai/gpt-luna
          effort: high
          timeout: 15m
          prompt: ${{ inputs.prompt }}
        env:
          # Execute this fork's frozen, ignore-scripts graph, never npx's range.
          PULLFROG_FORCE_LOCAL_CLI: "1"
