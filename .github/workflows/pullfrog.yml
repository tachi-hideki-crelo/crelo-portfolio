# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    # TEMPORARILY PAUSED, fail-closed. The reviewed Pullfrog 0.1.98 source
    # (official SHA ad4283a862b8377cb525a0f5bf30f17c023b18ea) still reports
    # 17 unresolved advisories (6 high) via `pnpm audit --json`; resume
    # requires a reviewed upstream release and an intentional re-enable review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@ad4283a862b8377cb525a0f5bf30f17c023b18ea # v0
        with:
          push: restricted
          shell: restricted
          prompt: ${{ inputs.prompt }}
        env:
          # Keep the fixed local-runtime path ready for a reviewed resume.
          PULLFROG_FORCE_LOCAL_CLI: "1"
